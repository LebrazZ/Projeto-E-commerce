</p>

<div class="formulario-pagamento">


<label>

Email
</label>

<input 
type="email"
id="email"

Telefone
</label>

<input 
type="tel"
id="telefone"
placeholder="Seu telefone">



<label>
Mensagem
</label>


<textarea 
id="mensagem"
placeholder="Digite sua mensagem">
</textarea>



<button 
class="comprar"
onclick="enviarMensagem()">

</button>
