<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contato | TechStore</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

        <div class="logo">
            <a href="index.html">TechStore</a>
        </div>

        <div class="search-box">

            <input type="text" placeholder="Pesquisar produtos...">

            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>

        <nav class="menu">

            <ul>

                <li><a href="index.html">Início</a></li>

                <li><a href="produtos.html">Produtos</a></li>

                <li><a href="promocoes.html">Promoções</a></li>

                <li><a href="contato.html">Contato</a></li>

                <div id="areaUsuario"></div>

            </ul>

        </nav>

        <div class="acoes">

            <a href="favoritos.html" title="Favoritos">
                <i class="fa-regular fa-heart"></i>
            </a>

            <a href="carrinho.html" class="carrinho" title="Carrinho">

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="contadorCarrinho">0</span>

            </a>

            <a href="login.html" title="Login">
                <i class="fa-regular fa-user"></i>
            </a>

        </div>

    </header>



<section class="produtos">


<div class="titulo-secao">

<h2>
Entre em contato 📩
</h2>


<p>
Envie sua dúvida ou mensagem.
</p>

</div>




<div class="formulario-pagamento">


<label>
Nome
</label>

<input 
type="text"
id="nome"
placeholder="Seu nome">



<label>
Email
</label>

<input 
type="email"
id="email"
placeholder="Seu email">



<label>
Telefone
</label>

<input 
type="tel"
id="telefone"
placeholder="Seu telefone">



<label>
Mensagem
</label>


<textarea 
id="mensagem"
placeholder="Digite sua mensagem">
</textarea>



<button 
class="comprar"
onclick="enviarMensagem()">

Enviar mensagem

</button>



</div>


</section>




<script src="contato.js"></script>


</body>

</html>
