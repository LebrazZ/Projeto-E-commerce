<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Tecnologia ao seu alcance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>
<body>
    
    <header class="header">

        <div class="logo">
            <a href="index.html">TechStore</a>
        </div>

       <div class="search-box">
            <input type="text" placeholder="Pesquisar produtos...">
            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
       </div>

       <nav class="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produto.html">Produtos</a></li>
                <li><a href="#">Promoções</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
       </nav>
       
       <div class="acoes">
        
            <a href="favoritos.html">
                <i class="fa-regular fa-heart"></i>
            </a>

            <a href="carrinho.html" class="carrinho">
                
                <i class="fa-solid fa-cart-shopping"></i>

                <span id="contadorCarrinho">0</span>

            </a>

            <a href="login.html">
                <i class="fa-regular fa-user"></i>
            </a>

       </div>

    </header>  
    
    <section class="banner">

        <div class="banner-text">

            <span>🔥 Ofertas da Semana</span>

            <h2>Tecnologia ao seu alcance.</h2>

            <p>
                Encontre notebooks, smartphones, acessórios e muito mais
                com qualidades, garantia e os melhores preços.
            </p>

            <a href="produto.html" class="btn-banner">
                Comprar Agora
            </a>

        </div>

        <div class="banner-img">

            <img src="img/notebook.png" alt="Notebook Gamer">

        </div>

    </section>

    <section class="produtos">

        <div class="titulo-secao">
            <h2>Produtos em Destaque</h2>
            <p>Confira os produtos mais vendidos da TechStore</p>
        </div>

        <div class="lista-produtos" id="listaProdutos">

        </div>

    </section>
    
    <script src="app.js"></script>

</body>
</html>
