<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | TechStore</title>

     <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<header class="header">

        <div class="logo">
            <a href="index.html">TechStore</a>
        </div>

        <div class="search-box">

            <input type="text" placeholder="Pesquisar produtos...">

            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>

        <nav class="menu">

            <ul>

                <li><a href="index.html">Início</a></li>

                <li><a href="produtos.html">Produtos</a></li>

                <li><a href="promocoes.html">Promoções</a></li>

                <li><a href="contato.html">Contato</a></li>

                <div id="areaUsuario"></div>

            </ul>

        </nav>

        <div class="acoes">

            <a href="favoritos.html" title="Favoritos">
                <i class="fa-regular fa-heart"></i>
            </a>

            <a href="carrinho.html" class="carrinho" title="Carrinho">

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="contadorCarrinho">0</span>

            </a>

            <a href="login.html" title="Login">
                <i class="fa-regular fa-user"></i>
            </a>

        </div>

    </header>
    
<div class="titulo-secao">

    <h2>Todos os Produtos</h2>

    <p>
        Encontre notebooks, smartphones, acessórios e muito mais.
    </p>


    <div class="filtros">


        <select id="categoriaFiltro">

            <option value="todos">
                Todas as categorias
            </option>

            <option value="notebook">
                Notebooks
            </option>

            <option value="smartphone">
                Smartphones
            </option>

            <option value="gamer">
                Gamer
            </option>

        </select>



        <select id="ordenarPreco">

            <option value="">
                Ordenar por
            </option>

            <option value="menor">
                Menor preço
            </option>

            <option value="maior">
                Maior preço
            </option>

        </select>


    </div>

</div>

<script src="produtos.js"></script>
<script src="app.js"></script>
<script src="usuario.js"></script>
<script src="contador.js"></script>

</body>
</html>
